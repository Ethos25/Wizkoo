<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA Concepts | Elite Standard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #E8AF38;
    --navy-bg: #0C1020;
    --navy-surface: #101830;
    --text-primary: #F0F2F8;
    --text-muted: rgba(240, 242, 248, 0.45);
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--navy-bg);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 50% 45%, rgba(24,40,72,0.40) 0%, rgba(16,24,48,0.10) 70%);
  }

  /* Simulated "This week's window" box */
  .sandbox-container {
    width: 600px;
    background: linear-gradient(145deg, rgba(20, 28, 56, 0.8), rgba(12, 16, 32, 0.9));
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 4px;
    padding: 60px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 80px;
    position: relative;
    overflow: hidden;
  }

  /* Grid lines to make it look like a lab */
  .sandbox-container::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .concept-block {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .concept-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  /* --------------------------------------------------------------------------
     CONCEPT A: THE MAGNETIC APERTURE
  -------------------------------------------------------------------------- */
  .cta-a {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-radius: 40px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-decoration: none;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .cta-a::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(232,175,56,0.1), transparent);
    transition: all 0.6s ease;
  }

  .cta-a .icon-circle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  
  .cta-a .plus {
    font-size: 14px;
    font-family: sans-serif;
    font-weight: 300;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); /* Spring physics */
  }

  .cta-a:hover {
    color: var(--text-primary);
    border-color: rgba(232,175,56,0.3);
    background: rgba(232,175,56,0.05);
    letter-spacing: 0.18em;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2), 0 0 15px rgba(232,175,56,0.08);
  }

  .cta-a:hover::before {
    left: 200%;
  }

  .cta-a:hover .icon-circle {
    border-color: var(--saffron);
    background: var(--saffron);
    color: var(--navy-bg);
  }

  .cta-a:hover .plus {
    transform: rotate(90deg);
  }

  /* --------------------------------------------------------------------------
     CONCEPT B: THE LASER-ETCHED BEAM
  -------------------------------------------------------------------------- */
  .cta-b {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    cursor: pointer;
    position: relative;
    padding-bottom: 4px;
  }

  .cta-b .text-wrapper {
    position: relative;
    display: inline-block;
  }

  .cta-b .dot-beam {
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 3px;
    height: 1px;
    background-color: var(--saffron);
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
  }

  .cta-b .arrow {
    opacity: 0;
    transform: translateX(-10px);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    color: var(--saffron);
  }

  .cta-b:hover {
    color: var(--text-primary);
    text-shadow: 0 4px 8px rgba(0,0,0,0.5);
    transform: translateZ(10px) translateY(-1px);
  }

  .cta-b:hover .dot-beam {
    width: 100%;
    box-shadow: 0 0 8px var(--saffron);
  }

  .cta-b:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* --------------------------------------------------------------------------
     CONCEPT C: THE INK REVEAL
  -------------------------------------------------------------------------- */
  .cta-c {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: rgba(240, 242, 248, 0.3);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    transition: all 0.5s ease;
    cursor: pointer;
    position: relative;
  }

  .cta-c .glow-pool {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform: scale(0.8);
    pointer-events: none;
    z-index: -1;
  }

  .cta-c .plus-line {
    position: relative;
    width: 10px;
    height: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cta-c .plus-line::before,
  .cta-c .plus-line::after {
    content: '';
    position: absolute;
    background: currentColor;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .cta-c .plus-line::before { width: 1px; height: 10px; } /* vertical */
  .cta-c .plus-line::after { width: 10px; height: 1px; } /* horizontal */

  .cta-c:hover {
    color: #ffffff;
    letter-spacing: 0.2em;
  }

  .cta-c:hover .glow-pool {
    opacity: 1;
    transform: scale(1);
  }

  .cta-c:hover .plus-line::before {
    height: 0px; /* Collapse vertical line */
  }

  .cta-c:hover .plus-line::after {
    width: 24px; /* Stretch horizontal line */
    background: var(--saffron);
  }

</style>
</head>
<body>

<div class="sandbox-container">

  <!-- CONCEPT A -->
  <div class="concept-block">
    <div class="concept-label">Concept A: The Magnetic Aperture</div>
    <a href="#" class="cta-a">
      <span>BUILD YOUR OWN</span>
      <div class="icon-circle">
        <span class="plus">+</span>
      </div>
    </a>
  </div>

  <!-- CONCEPT B -->
  <div class="concept-block">
    <div class="concept-label">Concept B: The Laser-Etched Beam</div>
    <a href="#" class="cta-b">
      <div class="text-wrapper">
        BUILD YOUR OWN
        <div class="dot-beam"></div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>

  <!-- CONCEPT C -->
  <div class="concept-block">
    <div class="concept-label">Concept C: The Ink Reveal</div>
    <a href="#" class="cta-c">
      <span>BUILD YOUR OWN</span>
      <div class="plus-line"></div>
      <div class="glow-pool"></div>
    </a>
  </div>

</div>

</body>
</html>
