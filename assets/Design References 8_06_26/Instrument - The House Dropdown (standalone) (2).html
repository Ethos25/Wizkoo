document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

30 / 55<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px 9px; border-bottom: 1px solid rgba(232,225,201,0.14);\">\n              <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 15px; font-weight: 500; color: rgba(232,225,201,0.20);\">your state<\u002Fspan>\n              <span style=\"display: inline-block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; line-height: 1; color: rgba(232,175,56,0.8); transform: rotate(180deg);\">⌄<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top: 9px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(232,225,201,0.36);\">State<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(232,175,56,0.7);\">open · 20 / 36<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin: 0; padding-left: 15px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.05em; line-height: 1.9; color: rgba(12,16,32,0.55);\">\n        <li>ratio locked at <strong style=\"font-weight: 700;\">×0.667<\u002Fstrong> (the comp's 45→30 and 62→40, rounded to one rule)<\u002Fli>\n        <li>ghost 0.30 × 0.667 = <strong style=\"font-weight: 700;\">0.20<\u002Fstrong> · caption 0.55 × 0.667 = <strong style=\"font-weight: 700;\">0.36<\u002Fstrong><\u002Fli>\n        <li>floor: neither may fall below <strong style=\"font-weight: 700;\">0.18<\u002Fstrong> — a seat resting lighter than 27% does not recede at all<\u002Fli>\n        <li>transition 140ms linear, both properties, in and out<\u002Fli>\n        <li>why proportional: new absolutes would recede the Arrival seat <em style=\"font-style: italic;\">further<\u002Fem> than the demo's, and 40% on a 55% caption is a lift, not a recede<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <!-- Q2 -->\n    <div style=\"display: flex; flex-direction: column; gap: 13px;\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">A2 · the menu clears the caption<\u002Fdiv>\n      <p style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; line-height: 1.25; letter-spacing: -0.008em;\">Menu opens below the caption. Anchor <strong style=\"font-weight: 600; color: #A8761F;\">top: 74px<\u002Fstrong>. The caption never moves.<\u002Fp>\n      <div style=\"padding: 20px 20px 18px; border-radius: 8px; background: #101830;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px 9px; border-bottom: 1px solid rgba(232,225,201,0.14);\">\n          <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 15px; font-weight: 500; color: rgba(232,225,201,0.20);\">your state<\u002Fspan>\n          <span style=\"display: inline-block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; line-height: 1; color: rgba(232,175,56,0.8); transform: rotate(180deg);\">⌄<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top: 9px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px;\">\n          <span style=\"font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(232,225,201,0.36);\">State<\u002Fspan>\n          <span style=\"font-family: 'Space Mono', monospace; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(232,175,56,0.55);\">↓ 12px<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top: 12px; padding: 7px 0 6px; background: #0B1226; border-radius: 2px; box-shadow: 0 0 0 1px rgba(250,250,250,0.1), 0 2px 0 0 rgba(6,8,18,0.6), 0 26px 46px -12px rgba(4,6,14,0.92);\">\n          <div style=\"padding: 0 13px 8px; font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(232,225,201,0.4);\">50 states<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 7px 13px; font-size: 13px; font-weight: 500; color: #FAFAFA; background: rgba(232,175,56,0.14); box-shadow: inset 2px 0 0 0 #E8AF38;\"><span>Alabama<\u002Fspan><\u002Fdiv>\n          <div style=\"padding: 7px 13px; font-size: 13px; font-weight: 500; color: rgba(232,225,201,0.55);\">Alaska<\u002Fdiv>\n          <div style=\"padding: 7px 13px; font-size: 13px; font-weight: 500; color: rgba(232,225,201,0.3);\">Arizona<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin: 0; padding-left: 15px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.05em; line-height: 1.9; color: rgba(12,16,32,0.55);\">\n        <li>anchor arithmetic: rule line 46 + caption margin 9 + caption box 13 + breath 6 = <strong style=\"font-weight: 700;\">74px<\u002Fstrong> (cream: <strong style=\"font-weight: 700;\">82px<\u002Fstrong> — seat 54 + 7 + 13 + 8)<\u002Fli>\n        <li><strong style=\"font-weight: 700;\">§5 amended:<\u002Fstrong> the night menu no longer replaces the rule. Rule stays, receding 28 → <strong style=\"font-weight: 700;\">14%<\u002Fstrong>; it is the seat's floor and the caption's ceiling<\u002Fli>\n        <li>the certificate gains no second line — the menu is a separate sheet below the record, not a member of it<\u002Fli>\n        <li>covered-while-open rejected: the caption is the accessible label; the record must stay readable while the answer is chosen<\u002Fli>\n        <li>caption-lifts rejected: it would break certificate grammar (caption sits below the rule, always) and animate type<\u002Fli>\n        <li>flip case: opening upward anchors <strong style=\"font-weight: 700;\">bottom: 100% + 10px<\u002Fstrong> from the seat box — the caption is below, so upward needs no caption clearance<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <!-- Q3 -->\n    <div style=\"display: flex; flex-direction: column; gap: 13px;\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">A3 · the narrow seat · closes WP-16B<\u002Fdiv>\n      <p style=\"margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; line-height: 1.25; letter-spacing: -0.008em;\">Menu is <strong style=\"font-weight: 600; color: #A8761F;\">158px<\u002Fstrong>, left-anchored to the seat. Grade is a long list.<\u002Fp>\n      <div style=\"padding: 20px 20px 18px; border-radius: 8px; background: #101830;\">\n        <div style=\"display: flex; align-items: baseline; gap: 7px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 500; color: rgba(232,225,201,0.72);\">\n          <span>Noah,<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: baseline; gap: 6px; min-width: 50px; padding: 0 2px 6px; border-bottom: 1px solid rgba(232,225,201,0.14);\">\n            <span style=\"font-style: italic; color: rgba(232,225,201,0.20);\">grade<\u002Fspan>\n            <span style=\"display: inline-block; font-size: 13px; line-height: 1; color: rgba(232,175,56,0.8); transform: rotate(180deg);\">⌄<\u002Fspan>\n          <\u002Fspan>\n          <span>in<\u002Fspan>\n          <span style=\"color: #E8AF38;\">Georgia<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top: 9px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(232,225,201,0.36);\">Grade<\u002Fdiv>\n        <div style=\"position: relative; margin-top: 12px; width: 158px;\">\n          <div style=\"padding: 7px 0 6px; background: #0B1226; border-radius: 2px; box-shadow: 0 0 0 1px rgba(250,250,250,0.1), 0 2px 0 0 rgba(6,8,18,0.6), 0 26px 46px -12px rgba(4,6,14,0.92);\">\n            <div style=\"padding: 0 13px 8px; font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(232,225,201,0.4);\">14 grades<\u002Fdiv>\n            <div style=\"position: relative;\">\n              <div style=\"padding: 2px 0 4px;\">\n                <div style=\"padding: 7px 13px; font-size: 13px; font-weight: 500; color: rgba(232,225,201,0.55); white-space: nowrap;\">Grade Pre-K<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 7px 13px; font-size: 13px; font-weight: 500; color: #FAFAFA; background: rgba(232,175,56,0.14); box-shadow: inset 2px 0 0 0 #E8AF38; white-space: nowrap;\"><span>Kindergarten<\u002Fspan><\u002Fdiv>\n                <div style=\"padding: 7px 13px; font-size: 13px; font-weight: 500; color: rgba(232,225,201,0.55); white-space: nowrap;\">Grade 1<\u002Fdiv>\n                <div style=\"padding: 7px 13px; font-size: 13px; font-weight: 500; color: rgba(232,225,201,0.55); white-space: nowrap;\">Grade 2<\u002Fdiv>\n                <div style=\"padding: 7px 13px; font-size: 13px; font-weight: 500; color: rgba(232,225,201,0.3); white-space: nowrap;\">Grade 3<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position: absolute; bottom: 0; left: 0; right: 0; height: 20px; background: linear-gradient(to top, #0B1226, rgba(11,18,38,0));\"><\u002Fdiv>\n              <div style=\"position: absolute; top: 4px; bottom: 6px; right: 5px; width: 2px; background: rgba(250,250,250,0.09);\">\n                <div style=\"position: absolute; top: 6%; height: 36%; left: 0; right: 0; background: rgba(232,225,201,0.42); border-radius: 1px;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position: absolute; top: -4px; left: 0; width: 50px; height: 3px; background: rgba(232,175,56,0.55);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 10px; font-family: 'Space Mono', monospace; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(232,175,56,0.55);\">seat 50px · menu 158px · left edges flush<\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin: 0; padding-left: 15px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.05em; line-height: 1.9; color: rgba(12,16,32,0.55);\">\n        <li><strong style=\"font-weight: 700;\">§1 amended:<\u002Fstrong> menu width = <code style=\"font-family: 'Space Mono', monospace;\">clamp(seat, min-content + 26px + 12px rail gutter, 320px)<\u002Fcode>. Grade resolves to <strong style=\"font-weight: 700;\">158px<\u002Fstrong> (“Kindergarten” at 13px = 120px + 26 + 12)<\u002Fli>\n        <li>width is measured once on mount and frozen — it never changes with the type buffer or the committed value<\u002Fli>\n        <li>anchor: <strong style=\"font-weight: 700;\">seat's left edge<\u002Fstrong>, always, so the record line's reading order is preserved. Flip to right-edge anchor only if the sheet would cross the record's right inset; never centre on the seat<\u002Fli>\n        <li><strong style=\"font-weight: 700;\">long list confirmed:<\u002Fstrong> 14 &gt; 8, so cap 268px, rail + thumb, both fade masks, buffer chip visible (“k” → Kindergarten). No short-list exception for grade<\u002Fli>\n        <li>row padding drops to <code style=\"font-family: 'Space Mono', monospace;\">7px 13px<\u002Fcode> / 13px type on inline record seats — the only permitted deviation from the 34px row; menu rows never wrap and never truncate<\u002Fli>\n        <li><strong style=\"font-weight: 700;\">WP-16B resolved:<\u002Fstrong> grade's composed position needs no reflow. The fragment stays ~50px in the sentence and the sheet overhangs to the right of it — one problem, one rule: the seat sizes the sentence, the content sizes the menu<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <p style=\"margin: 0; max-width: 68ch; font-size: 12.5px; font-weight: 500; line-height: 1.6; color: rgba(12,16,32,0.62);\">Paste order for the build follow-up: A1 replaces the §5 recede pair, A2 replaces the §5 “menu replaces the rule” clause and its <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">top<\u002Fcode> value, A3 replaces §1's menu-width rule. Everything else in <a href=\"#spec-instrument\">the spec<\u002Fa> stands unchanged.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"turn-4\" style=\"display: flex; flex-direction: column; gap: 34px; padding: 56px 48px 88px; background: #E2DCCB; font-family: 'Plus Jakarta Sans', sans-serif; color: #0C1020;\">\n\n  <header style=\"display: flex; flex-direction: column; gap: 14px; max-width: 940px;\">\n    <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.55);\">Commission 02 · The Instrument · one anatomy, two materials<\u002Fdiv>\n    <h1 style=\"font-family: 'Fraunces', serif; font-weight: 600; font-size: 42px; line-height: 1.06; letter-spacing: -0.015em; margin: 0;\">The house dropdown.<\u002Fh1>\n    <p style=\"margin: 0; max-width: 66ch; font-size: 15px; font-weight: 500; line-height: 1.6; color: rgba(12,16,32,0.7); text-wrap: pretty;\">Left column is the night register for the Arrival ceremony; right column is Hearth verbatim, light edge top. Each material shows the live instrument you can drive with the keyboard, then the four certified states, then the short-list case. Values are annotated on the surface; the <a href=\"#spec-instrument\">build spec<\u002Fa> carries the keyframes and the listbox contract.<\u002Fp>\n    <p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(12,16,32,0.45);\">Try the live ones · click, then ↑ ↓ · type “ge” for Georgia · enter commits · esc closes<\u002Fp>\n  <\u002Fheader>\n\n  <div style=\"display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap;\">\n\n    <!-- ══════════ NIGHT ══════════ -->\n    <article id=\"4a\" style=\"width: 620px; display: flex; flex-direction: column; gap: 18px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid rgba(12,16,32,0.18);\">\n        <div style=\"display: flex; align-items: baseline; gap: 14px;\">\n          <span style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; padding-bottom: 3px; border-bottom: 1.5px solid #E8AF38;\">4A<\u002Fspan>\n          <h2 style=\"font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; letter-spacing: -0.01em; margin: 0;\">Night — the ceremony<\u002Fh2>\n          <span style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.45);\">saffron invited, never resident<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 13px; font-weight: 500; line-height: 1.55; color: rgba(12,16,32,0.7);\">A certificate seat on the planetarium ground: hairline rule, ghost question in dim chalk italic, Space Mono caption beneath. Nothing is lit until a hand is on it — hover and focus warm the rule toward saffron and let go. Commitment is the one permitted gold: the value stands upright in Saffron, the rule fades to 10%, the caption drops to 35%.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- LIVE -->\n      <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.45);\">Live · 50 options<\u002Fdiv>\n        <div style=\"position: relative; padding: 42px 44px 360px; background-color: #101830; background-image: radial-gradient(1px 1px at 16% 20%, rgba(250,250,250,0.5), transparent), radial-gradient(1px 1px at 74% 14%, rgba(250,250,250,0.32), transparent), radial-gradient(1.5px 1.5px at 44% 62%, rgba(250,250,250,0.24), transparent), linear-gradient(#101830, #141E3A);\">\n          <div style=\"position: relative; width: 320px;\">\n            <div tabindex=\"0\" role=\"combobox\" aria-haspopup=\"listbox\" aria-expanded=\"{{ nExpanded }}\" sc-camel-on-click=\"{{ nToggle }}\" sc-camel-on-key-down=\"{{ nKey }}\" style=\"{{ nSeatStyle }}\" style-hover=\"border-bottom-color: rgba(232,175,56,0.55);\">\n              <span style=\"{{ nValueStyle }}\">{{ nValueText }}<\u002Fspan>\n              <span style=\"{{ nChevronStyle }}\">⌄<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ nCaptionStyle }}\">State<\u002Fdiv>\n            <sc-if value=\"{{ nOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"listbox\" style=\"position: absolute; top: 46px; left: 0; right: 0; z-index: 20; padding: 7px 0 0; background: #0B1226; border-radius: 2px; box-shadow: 0 0 0 1px rgba(250,250,250,0.10), 0 2px 0 0 rgba(6,8,18,0.6), 0 26px 46px -12px rgba(4,6,14,0.92); animation: none;\">\n                <div style=\"{{ nBufferStyle }}\">{{ nBufferText }}<\u002Fdiv>\n                <div style=\"position: relative;\">\n                  <div class=\"om-scroll\" sc-camel-on-scroll=\"{{ nScroll }}\" ref=\"{{ nListRef }}\" style=\"max-height: 268px; overflow-y: auto; padding: 4px 0 6px;\">\n                    <sc-for list=\"{{ nOptions }}\" as=\"opt\" hint-placeholder-count=\"7\">\n                      <div role=\"option\" sc-camel-on-click=\"{{ opt.pick }}\" sc-camel-on-mouse-enter=\"{{ opt.enter }}\" style=\"{{ opt.style }}\">\n                        <span>{{ opt.label }}<\u002Fspan>\n                        <span style=\"{{ opt.markStyle }}\">{{ opt.mark }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"position: absolute; top: 0; left: 0; right: 0; height: 18px; pointer-events: none; background: linear-gradient(to bottom, #0B1226, rgba(11,18,38,0));\"><\u002Fdiv>\n                  <div style=\"position: absolute; bottom: 0; left: 0; right: 0; height: 22px; pointer-events: none; background: linear-gradient(to top, #0B1226, rgba(11,18,38,0));\"><\u002Fdiv>\n                  <div style=\"position: absolute; top: 6px; bottom: 8px; right: 5px; width: 2px; background: rgba(250,250,250,0.09); pointer-events: none;\">\n                    <div style=\"{{ nThumbStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- FOUR STATES -->\n      <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.45);\">The four states<\u002Fdiv>\n        <div style=\"padding: 40px 40px 44px; background-color: #101830; background-image: radial-gradient(1px 1px at 22% 16%, rgba(250,250,250,0.44), transparent), radial-gradient(1px 1px at 80% 40%, rgba(250,250,250,0.28), transparent), linear-gradient(#101830, #141E3A);\">\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 34px 30px;\">\n\n            <!-- closed -->\n            <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(232,225,201,0.5);\">01 closed · empty ghost<\u002Fdiv>\n              <div>\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px 9px; border-bottom: 1px solid rgba(232,225,201,0.28);\">\n                  <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 16px; font-weight: 500; color: rgba(232,225,201,0.45);\">your state<\u002Fspan>\n                  <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; line-height: 1; color: rgba(232,225,201,0.45);\">⌄<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"margin-top: 9px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(232,225,201,0.62);\">State<\u002Fdiv>\n              <\u002Fdiv>\n              <ul style=\"margin: 0; padding-left: 15px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.05em; line-height: 1.85; color: rgba(232,225,201,0.42);\">\n                <li>ghost · JakartaSans 500 italic 16px · chalk-dim 45%<\u002Fli>\n                <li>rule · 1px chalk-dim 28% · seat pad 0 2px 9px<\u002Fli>\n                <li>caption · Mono 500 10px · 0.16em · chalk-dim 62%<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n\n            <!-- hover -->\n            <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(232,225,201,0.5);\">02 hover / focus · invited<\u002Fdiv>\n              <div>\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px 9px; border-bottom: 1px solid rgba(232,175,56,0.55);\">\n                  <span style=\"font-family:           <div style=\"position: relative;\">\n                    <div style=\"padding: 4px 0 6px;\">\n                      <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">Florida<\u002Fdiv>\n                      <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; font-size: 14px; font-weight: 600; color: #0C1020; background: linear-gradient(180deg, rgba(244,221,153,0.62), rgba(244,221,153,0.34)); box-shadow: inset 2px 0 0 0 #E8AF38;\"><span>Georgia<\u002Fspan><\u002Fdiv>\n                      <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">Hawaii<\u002Fdiv>\n                      <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">Idaho<\u002Fdiv>\n                      <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.45);\">Illinois<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"position: absolute; top: 0; left: 0; right: 0; height: 18px; background: linear-gradient(to bottom, #FBF6E9, rgba(248,244,233,0));\"><\u002Fdiv>\n                    <div style=\"position: absolute; bottom: 0; left: 0; right: 0; height: 22px; background: linear-gradient(to top, #F2ECDC, rgba(248,244,233,0));\"><\u002Fdiv>\n                    <div style=\"position: absolute; top: 6px; bottom: 8px; right: 5px; width: 2px; background: rgba(12,16,32,0.08);\">\n                      <div style=\"position: absolute; top: 34%; height: 26%; left: 0; right: 0; background: rgba(12,16,32,0.26); border-radius: 1px;\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <ul style=\"margin: 0; padding-left: 15px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.05em; line-height: 1.85; color: rgba(12,16,32,0.5);\">\n                <li>menu floats 8px below the seat · seat stays, fill 62→50%<\u002Fli>\n                <li>active row is the sun · saffron-wash 62→34% + 2px saffron edge<\u002Fli>\n                <li>buffer in Amber #A8761F — ink on cream, not a second glow<\u002Fli>\n                <li>thumb ink 26% · masks #FBF6E9 top / #F2ECDC foot<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n\n            <!-- committed -->\n            <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">04 committed<\u002Fdiv>\n              <div>\n                <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-radius: 8px; background: rgba(255,255,255,0.62); box-shadow: inset 0 1px 2px 0 rgba(12,16,32,0.06), inset 0 0 0 1px rgba(12,16,32,0.07);\">\n                  <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 600; color: #0C1020;\">Georgia<\u002Fspan>\n                  <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; line-height: 1; color: rgba(12,16,32,0.42);\">⌄<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"margin-top: 7px; padding-left: 2px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.35);\">State<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top: 2px; padding: 7px 0 6px; border-radius: 8px; background-color: #F8F4E9; background-image: linear-gradient(180deg, rgba(244,221,153,0.5) 0%, rgba(248,244,233,0) 46%); box-shadow: 0 1px 0 0 rgba(8,10,22,0.16), 0 18px 34px -8px rgba(195,139,62,0.34), 0 34px 48px -20px rgba(8,10,22,0.28);\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; font-size: 14px; font-weight: 600; color: #0C1020; background: linear-gradient(180deg, rgba(244,221,153,0.62), rgba(244,221,153,0.34)); box-shadow: inset 2px 0 0 0 #E8AF38;\"><span>Georgia<\u002Fspan><span style=\"font-size: 12px; color: #A8761F;\">✓<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\"><span>Hawaii<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <ul style=\"margin: 0; padding-left: 15px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.05em; line-height: 1.85; color: rgba(12,16,32,0.5);\">\n                <li>value · JakartaSans 600 15px ink 100% (cream never golds text)<\u002Fli>\n                <li>caption drops 50→35% · seat returns to rest fill<\u002Fli>\n                <li>reopened · committed row carries a 12px amber ✓; if it is also active it takes the wash — one mark, two jobs<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- GRADE -->\n      <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.45);\">Short list · grade · the empty-room test<\u002Fdiv>\n        <div style=\"padding: 40px 44px 44px; border-radius: 8px; background-color: #F8F4E9; background-image: linear-gradient(180deg, rgba(244,221,153,0.5) 0%, rgba(248,244,233,0) 46%), linear-gradient(180deg, rgba(237,231,212,0) 58%, rgba(232,225,201,0.9) 100%), repeating-linear-gradient(0deg, rgba(12,16,32,0.012) 0 0.5px, transparent 0.5px 4px);\">\n          <div style=\"display: flex; gap: 40px; align-items: flex-start;\">\n            <div style=\"width: 240px;\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-radius: 8px; background: rgba(255,255,255,0.5); box-shadow: inset 0 1px 2px 0 rgba(12,16,32,0.06), inset 0 0 0 1px rgba(12,16,32,0.07);\">\n                <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 15px; font-weight: 500; color: rgba(12,16,32,0.3);\">your grade<\u002Fspan>\n                <span style=\"display: inline-block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; line-height: 1; color: rgba(12,16,32,0.5); transform: rotate(180deg);\">⌄<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top: 8px; padding: 7px 0 6px; border-radius: 8px; background-color: #F8F4E9; background-image: linear-gradient(180deg, rgba(244,221,153,0.5) 0%, rgba(248,244,233,0) 46%), linear-gradient(180deg, rgba(237,231,212,0) 58%, rgba(232,225,201,0.9) 100%); box-shadow: 0 1px 0 0 rgba(8,10,22,0.16), 0 18px 34px -8px rgba(195,139,62,0.34), 0 34px 48px -20px rgba(8,10,22,0.28);\">\n                <div style=\"padding: 0 14px 8px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(12,16,32,0.42);\">7 grades<\u002Fdiv>\n                <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">PreK<\u002Fdiv>\n                <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">Kindergarten<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; font-size: 14px; font-weight: 600; color: #0C1020; background: linear-gradient(180deg, rgba(244,221,153,0.62), rgba(244,221,153,0.34)); box-shadow: inset 2px 0 0 0 #E8AF38;\"><span>Grade 1<\u002Fspan><\u002Fdiv>\n                <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">Grade 2<\u002Fdiv>\n                <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">Grade 3<\u002Fdiv>\n                <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">Grade 4<\u002Fdiv>\n                <div style=\"padding: 8px 14px; font-size: 14px; font-weight: 500; color: rgba(12,16,32,0.7);\">Grade 5<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <ul style=\"margin: 0; padding-left: 15px; max-width: 250px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.05em; line-height: 1.9; color: rgba(12,16,32,0.5);\">\n              <li>same anatomy, no cap, no rail — the sheet is content-height<\u002Fli>\n              <li>the rake still runs top→46%, so a 7-row menu is lit exactly like a 50-row one<\u002Fli>\n              <li>falloff compresses with the sheet; it is never removed<\u002Fli>\n              <li>type-ahead stays enabled (“k” → Kindergarten) but the buffer chip is hidden under 8 rows — nothing to hunt for<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══════════════════ BUILD SPEC ══════════════════ -->\n<section id=\"spec-instrument\" style=\"padding: 60px 48px 100px; background-color: #F8F4E9; background-image: linear-gradient(180deg, rgba(244,221,153,0.5) 0%, rgba(248,244,233,0) 46%), linear-gradient(180deg, rgba(237,231,212,0) 58%, rgba(232,225,201,0.9) 100%), repeating-linear-gradient(0deg, rgba(12,16,32,0.012) 0 0.5px, transparent 0.5px 4px); font-family: 'Plus Jakarta Sans', sans-serif; color: #0C1020;\">\n  <div style=\"max-width: 1000px; display: flex; flex-direction: column; gap: 34px;\">\n\n    <header style=\"display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.55);\">Build spec · lift verbatim · invent nothing<\u002Fdiv>\n      <h2 style=\"font-family: 'Fraunces', serif; font-weight: 600; font-size: 38px; line-height: 1.06; letter-spacing: -0.015em; margin: 0;\">One anatomy, two materials.<\u002Fh2>\n    <\u002Fheader>\n\n    <div style=\"height: 1px; background: rgba(12,16,32,0.16);\"><\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 34px 40px;\">\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">§1 · Anatomy &amp; geometry<\u002Fdiv>\n        <dl style=\"margin: 0; display: grid; grid-template-columns: 116px 1fr; gap: 8px 16px; font-size: 12.5px; font-weight: 500; line-height: 1.55;\">\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Row<\u002Fdt>\n          <dd style=\"margin: 0;\">34px tall — <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">padding: 8px 14px<\u002Fcode>, Plus Jakarta Sans 500 14px. Never below 34px; touch targets get 44px via <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">padding: 13px 14px<\u002Fcode> under 640px.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Height cap<\u002Fdt>\n          <dd style=\"margin: 0;\"><code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">max-height: 268px<\u002Fcode> on the scroll body (≈7.5 rows — the half row is the scroll affordance). Lists of ≤8 rows set no cap and render content-height.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Count line<\u002Fdt>\n          <dd style=\"margin: 0;\">Space Mono 500 9.5px / 0.18em uppercase, ink or chalk-dim at 42%, <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">padding: 0 14px 8px<\u002Fcode>. Always present, both materials, both list lengths.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Width<\u002Fdt>\n          <dd style=\"margin: 0;\">Menu matches the seat box exactly (<code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">left: 0; right: 0<\u002Fcode>). No min-width games, no centring.<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">§2 · Scroll — never the OS<\u002Fdiv>\n        <dl style=\"margin: 0; display: grid; grid-template-columns: 116px 1fr; gap: 8px 16px; font-size: 12.5px; font-weight: 500; line-height: 1.55;\">\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Suppress<\u002Fdt>\n          <dd style=\"margin: 0;\"><code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">scrollbar-width: none; -ms-overflow-style: none;<\u002Fcode> + <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">::-webkit-scrollbar { width: 0; display: none }<\u002Fcode>.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Rail<\u002Fdt>\n          <dd style=\"margin: 0;\">2px, inset <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">top 6 / bottom 8 / right 5<\u002Fcode>. Track: night <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">rgba(250,250,250,0.09)<\u002Fcode>, cream <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">rgba(12,16,32,0.08)<\u002Fcode>. Thumb: night <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">rgba(232,225,201,0.42)<\u002Fcode>, cream <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">rgba(12,16,32,0.26)<\u002Fcode>, radius 1, min height 24px. Height = <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">clientH/scrollH<\u002Fcode>, offset = <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">scrollTop/scrollH<\u002Fcode>. Presentational only — never a drag handle.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Fade masks<\u002Fdt>\n          <dd style=\"margin: 0;\">18px top, 22px foot, <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">pointer-events: none<\u002Fcode>. Night both ends <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#0B1226<\u002Fcode>; cream top <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#FBF6E9<\u002Fcode>, foot <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#F2ECDC<\u002Fcode> — they must match the rake at that height, not a flat chalk.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Keyboard scroll<\u002Fdt>\n          <dd style=\"margin: 0;\">Arrow movement calls <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">el.scrollTop = …<\u002Fcode> arithmetic against the 34px row — never <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">scrollIntoView<\u002Fcode>.<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">§3 · Type-to-jump<\u002Fdiv>\n        <dl style=\"margin: 0; display: grid; grid-template-columns: 116px 1fr; gap: 8px 16px; font-size: 12.5px; font-weight: 500; line-height: 1.55;\">\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Behaviour<\u002Fdt>\n          <dd style=\"margin: 0;\">Printable keys append to a buffer; first prefix match becomes active and scrolls into range. Buffer clears 900ms after the last key, or on commit / escape. Backspace trims one character. No filtering — the list never shortens, so the alphabet stays where the hand left it.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Display<\u002Fdt>\n          <dd style=\"margin: 0;\">The buffer chip sits at the right of the count line: Space Mono 700 10px / 0.24em uppercase. Night <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#E8AF38<\u002Fcode>; cream <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#A8761F<\u002Fcode> (Amber — ink on cream, so it is not a second sun). Fades in over 120ms, out over 200ms. Hidden entirely for lists ≤8 rows.<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">§4 · Option anatomy · four rows<\u002Fdiv>\n        <dl style=\"margin: 0; display: grid; grid-template-columns: 116px 1fr; gap: 8px 16px; font-size: 12.5px; font-weight: 500; line-height: 1.55;\">\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Resting<\u002Fdt>\n          <dd style=\"margin: 0;\">Night chalk-dim 55% · cream ink 70%. No fill.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Hover<\u002Fdt>\n          <dd style=\"margin: 0;\">Night: text → <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#FAFAFA<\u002Fcode>, fill <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">rgba(232,175,56,0.08)<\u002Fcode> — saffron invited, no edge. Cream: text → ink 100%, fill <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">rgba(255,255,255,0.5)<\u002Fcode>. 120ms ease-standard.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Active (kbd)<\u002Fdt>\n          <dd style=\"margin: 0;\">Night: fill <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">rgba(232,175,56,0.14)<\u002Fcode> + <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">inset 2px 0 0 #E8AF38<\u002Fcode>, text <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#FAFAFA<\u002Fcode>. Cream: fill <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">linear-gradient(180deg, rgba(244,221,153,0.62), rgba(244,221,153,0.34))<\u002Fcode> + same 2px saffron edge, weight 600. Mouse and keyboard share one active row — hovering moves it.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Committed<\u002Fdt>\n          <dd style=\"margin: 0;\">Marked, not lit: a 12px <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">✓<\u002Fcode> at the row's right — night <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#E8AF38<\u002Fcode>, cream Amber <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#A8761F<\u002Fcode> — plus weight 600 and full-strength text. If the committed row is also active it takes the active fill and keeps the one ✓; no doubled marking, no dot, no second colour.<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">§5 · Elevation &amp; position<\u002Fdiv>\n        <dl style=\"margin: 0; display: grid; grid-template-columns: 116px 1fr; gap: 8px 16px; font-size: 12.5px; font-weight: 500; line-height: 1.55;\">\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Night lift<\u002Fdt>\n          <dd style=\"margin: 0;\">Ground <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">#0B1226<\u002Fcode> (planetarium shaded — darker than the ceremony so it reads as nearer), radius 2. <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">0 0 0 1px rgba(250,250,250,0.10), 0 2px 0 0 rgba(6,8,18,0.6), 0 26px 46px -12px rgba(4,6,14,0.92)<\u002Fcode>.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Cream lift<\u002Fdt>\n          <dd style=\"margin: 0;\">Hearth three-layer, no border, radius 8: <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">0 1px 0 0 rgba(8,10,22,0.16), 0 18px 34px -8px rgba(195,139,62,0.34), 0 34px 48px -20px rgba(8,10,22,0.28)<\u002Fcode>. The amber body is mandatory. The menu carries its own rake (<code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">180deg rgba(244,221,153,0.5) → 46%<\u002Fcode>) and falloff (<code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">→ rgba(232,225,201,0.9)<\u002Fcode>) — it is a new sheet under the same sun, not a tinted panel.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">vs the rule<\u002Fdt>\n          <dd style=\"margin: 0;\"><strong style=\"font-weight: 700;\">Night: the menu replaces the rule.<\u002Fstrong> The hairline is the seat's floor; the menu occupies that line (<code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">top: 46px<\u002Fcode>, rule <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">opacity 0<\u002Fcode> over 120ms) so the certificate does not gain a second line. <strong style=\"font-weight: 700;\">Cream: the menu floats<\u002Fstrong> 8px below the seat recess, which remains visible at fill 50%.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Ghost + caption<\u002Fdt>\n          <dd style=\"margin: 0;\">While open both recede, never vanish: ghost 45→30%, caption 62→40% (night) / 50→38% (cream). The question stays answerable while the answer is being chosen. Chevron rotates 180°.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Flip<\u002Fdt>\n          <dd style=\"margin: 0;\">If the cap does not clear the viewport foot, the menu opens upward from the same anchor: masks and rail unchanged, transform origin moves to <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">bottom<\u002Fcode>. Never a centred overlay.<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">§6 · Motion — casino test passed<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 12.5px; font-weight: 500; line-height: 1.6; color: rgba(12,16,32,0.75);\">One gesture in, one out. No spring, no overshoot, no pulse, no shimmer, nothing that repeats. Opacity and a 4px translate only — the menu never scales the type.<\u002Fp>\n        <pre style=\"margin: 0; padding: 16px 18px; border-radius: 8px; background: rgba(255,255,255,0.52); box-shadow: inset 0 0 0 1px rgba(12,16,32,0.08); font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 500; line-height: 1.75; color: rgba(12,16,32,0.82); white-space: pre-wrap;\">OPEN   160ms cubic-bezier(0.2, 0, 0, 1)   /* ease-editorial */\n       transform-origin: top\n       0%    opacity 0   translateY(-4px)\n       100%  opacity 1   translateY(0)\n       rows: no stagger. the sheet arrives whole.\n\nCLOSE  120ms cubic-bezier(0.4, 0, 1, 1)\n       100%  opacity 0   translateY(-2px)\n\nCHEVRON      180ms ease-editorial   rotate(0 → 180deg)\nRULE (night) 120ms linear           opacity 1 → 0\nACTIVE ROW   120ms ease-standard    background + color only\nSEAT FOCUS   140ms ease-standard    box-shadow + background\nBUFFER CHIP  in 120ms / out 200ms   opacity only\n\nCOMMIT  no motion on the row. the menu closes on the standard\n        120ms and the seat's value crossfades 140ms. nothing\n        flashes to confirm — the ✓ and the value are the receipt.\n\nprefers-reduced-motion: reduce  →  all durations 0ms.\n                                   no state, colour, or layout change.<\u002Fpre>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,0.6); padding-bottom: 8px; border-bottom: 1px solid rgba(12,16,32,0.14);\">§7 · Accessibility — listbox contract<\u002Fdiv>\n        <dl style=\"margin: 0; display: grid; grid-template-columns: 116px 1fr; gap: 8px 16px; font-size: 12.5px; font-weight: 500; line-height: 1.55;\">\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Roles<\u002Fdt>\n          <dd style=\"margin: 0;\">Trigger <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">role=\"combobox\"<\u002Fcode> + <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">aria-haspopup=\"listbox\"<\u002Fcode> + <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">aria-expanded<\u002Fcode> + <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">aria-controls<\u002Fcode>; menu <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">role=\"listbox\"<\u002Fcode>; rows <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">role=\"option\"<\u002Fcode> + <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">aria-selected<\u002Fcode>. Active row mirrored by <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">aria-activedescendant<\u002Fcode> — focus stays on the trigger. Caption is the <code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">aria-label<\u002Fcode>; ghost text is never the only label.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Keys<\u002Fdt>\n          <dd style=\"margin: 0;\">↑ ↓ move · Home / End jump · PgUp / PgDn ±7 · Enter or Space commits · Esc closes and restores the prior value · Tab closes, commits nothing · printable keys feed type-ahead. Closed seat: ↓ or Enter opens on the committed row, or row 0.<\u002Fdd>\n          <dt style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(12,16,32,0.5);\">Contrast<\u002Fdt>\n          <dd style=\"margin: 0;\">Resting rows clear 4.5:1 on both grounds; the 2px saffron edge is never the sole active indicator (fill and weight carry it too). Focus is the saffron ring on cream and the 1.5px saffron rule on night — no brand-blue ring, no OS outline (<code style=\"font-family: 'Space Mono', monospace; font-size: 11.5px;\">outline: none<\u002Fcode> only ever paired with one of those two).<\u002Fdd>\n        <\u002Fdl>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"height: 1px; background: rgba(12,16,32,0.16);\"><\u002Fdiv>\n    <p style=\"margin: 0; max-width: 68ch; font-size: 13px; font-weight: 500; line-height: 1.6; color: rgba(12,16,32,0.62);\">Both materials share one component and one state machine; the material is a single prop. Hearth values here are lifted from the certified spec (registry 3b1335a8d332813d9e2af4ec07e9028e) — see <a href=\"#spec\">the Hearth spec<\u002Fa> if a value needs a source. Founder's ruling needed on one thing only: on cream, committed text stays ink 600 rather than golding, because gold text on cream would be a second sun. Night golds because the night has no other sun to lose.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst STATES = [\"Alabama\",\"Alaska\",\"Arizona\",\"Arkansas\",\"California\",\"Colorado\",\"Connecticut\",\"Delaware\",\"Florida\",\"Georgia\",\"Hawaii\",\"Idaho\",\"Illinois\",\"Indiana\",\"Iowa\",\"Kansas\",\"Kentucky\",\"Louisiana\",\"Maine\",\"Maryland\",\"Massachusetts\",\"Michigan\",\"Minnesota\",\"Mississippi\",\"Missouri\",\"Montana\",\"Nebraska\",\"Nevada\",\"New Hampshire\",\"New Jersey\",\"New Mexico\",\"New York\",\"North Carolina\",\"North Dakota\",\"Ohio\",\"Oklahoma\",\"Oregon\",\"Pennsylvania\",\"Rhode Island\",\"South Carolina\",\"South Dakota\",\"Tennessee\",\"Texas\",\"Utah\",\"Vermont\",\"Virginia\",\"Washington\",\"West Virginia\",\"Wisconsin\",\"Wyoming\"];\nconst ROW = 34, CAP = 268;\n\nclass Component extends DCLogic {\n  state = {\n    night: { open: false, value: null, active: 0, buffer: \"\", thumbTop: 0, thumbH: 26 },\n    cream: { open: false, value: null, active: 0, buffer: \"\", thumbTop: 0, thumbH: 26 },\n  };\n\n  constructor(props) {\n    super(props);\n    this.refs = { night: null, cream: null };\n    this.timers = {};\n  }\n\n  set(key, patch) {\n    this.setState(s => ({ [key]: Object.assign({}, s[key], patch) }));\n  }\n\n  scrollTo(key, idx) {\n    const el = this.refs[key];\n    if (!el) return;\n    const top = idx * ROW, bottom = top + ROW;\n    if (top < el.scrollTop) el.scrollTop = top;\n    else if (bottom > el.scrollTop + CAP) el.scrollTop = bottom - CAP;\n  }\n\n  measure(key) {\n    const el = this.refs[key];\n    if (!el) return;\n    const frac = Math.min(1, el.clientHeight / el.scrollHeight);\n    this.set(key, {\n      thumbH: Math.max(24, frac * el.clientHeight),\n      thumbTop: (el.scrollTop / el.scrollHeight) * el.clientHeight,\n    });\n  }\n\n  open(key) {\n    const st = this.state[key];\n    const idx = st.value ? STATES.indexOf(st.value) : 0;\n    this.set(key, { open: true, active: Math.max(0, idx) });\n    setTimeout(() => { this.scrollTo(key, Math.max(0, idx)); this.measure(key); }, 0);\n  }\n\n  close(key) {\n    clearTimeout(this.timers[key]);\n    this.set(key, { open: false, buffer: \"\" });\n  }\n\n  commit(key, val) {\n    clearTimeout(this.timers[key]);\n    this.set(key, { open: false, value: val, buffer: \"\" });\n  }\n\n  type(key, ch) {\n    const buffer = (this.state[key].buffer + ch).toLowerCase();\n    const idx = STATES.findIndex(s => s.toLowerCase().startsWith(buffer));\n    this.set(key, { buffer, active: idx >= 0 ? idx : this.state[key].active });\n    if (idx >= 0) setTimeout(() => { this.scrollTo(key, idx); this.measure(key); }, 0);\n    clearTimeout(this.timers[key]);\n    this.timers[key] = setTimeout(() => this.set(key, { buffer: \"\" }), 900);\n  }\n\n  move(key, delta) {\n    const st = this.state[key];\n    if (!st.open) return this.open(key);\n    const next = Math.max(0, Math.min(STATES.length - 1, st.active + delta));\n    this.set(key, { active: next });\n    setTimeout(() => { this.scrollTo(key, next); this.measure(key); }, 0);\n  }\n\n  keyHandler(key) {\n    return e => {\n      const st = this.state[key];\n      const k = e.key;\n      if (k === \"ArrowDown\") { e.preventDefault(); this.move(key, 1); }\n      else if (k === \"ArrowUp\") { e.preventDefault(); this.move(key, -1); }\n      else if (k === \"PageDown\") { e.preventDefault(); this.move(key, 7); }\n      else if (k === \"PageUp\") { e.preventDefault(); this.move(key, -7); }\n      else if (k === \"Home\") { e.preventDefault(); this.move(key, -STATES.length); }\n      else if (k === \"End\") { e.preventDefault(); this.move(key, STATES.length); }\n      else if (k === \"Enter\" || k === \" \") {\n        e.preventDefault();\n        if (st.open) this.commit(key, STATES[st.active]); else this.open(key);\n      }\n      else if (k === \"Escape\") { e.preventDefault(); this.close(key); }\n      else if (k === \"Backspace\" && st.buffer) { e.preventDefault(); this.set(key, { buffer: st.buffer.slice(0, -1) }); }\n      else if (k.length === 1 && /[a-z ]/i.test(k)) { e.preventDefault(); if (!st.open) this.open(key); this.type(key, k); }\n    };\n  }\n\n  options(key) {\n    const st = this.state[key];\n    const night = key === \"night\";\n    return STATES.map((label, i) => {\n      const isActive = i === st.active;\n      const isPicked = label === st.value;\n      let bg = \"transparent\", color, weight = 500, edge = \"\";\n      if (night) {\n        color = \"rgba(232,225,201,0.55)\";\n        if (isPicked) { color = \"#E8AF38\"; weight = 500; }\n        if (isActive) { bg = \"rgba(232,175,56,0.14)\"; color = isPicked ? \"#E8AF38\" : \"#FAFAFA\"; edge = \"inset 2px 0 0 0 #E8AF38\"; }\n      } else {\n        color = \"rgba(12,16,32,0.7)\";\n        if (isPicked) { color = \"#0C1020\"; weight = 600; }\n        if (isActive) { bg = \"linear-gradient(180deg, rgba(244,221,153,0.62), rgba(244,221,153,0.34))\"; color = \"#0C1020\"; weight = 600; edge = \"inset 2px 0 0 0 #E8AF38\"; }\n      }\n      return {\n        label,\n        mark: isPicked ? \"✓\" : \"\",\n        markStyle: `font-size: 12px; line-height: 1; color: ${night ? \"#E8AF38\" : \"#A8761F\"};`,\n        style: `display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: ${weight}; color: ${color}; background: ${bg}; box-shadow: ${edge || \"none\"}; cursor: pointer; transition: background 120ms cubic-bezier(0.4,0,0.2,1), color 120ms cubic-bezier(0.4,0,0.2,1);`,\n        pick: () => this.commit(key, label),\n        enter: () => this.set(key, { active: i }),\n      };\n    });\n  }\n\n  pack(key) {\n    const st = this.state[key];\n    const night = key === \"night\";\n    const P = night ? \"n\" : \"c\";\n    const has = !!st.value;\n    const ghostAlpha = st.open ? 0.30 : (has ? 1 : 0.42);\n    const out = {};\n\n    if (night) {\n      const rule = st.open ? \"transparent\" : (has ? \"rgba(232,225,201,0.10)\" : \"rgba(232,225,201,0.28)\");\n      out.nSeatStyle = `display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px 9px; border-bottom: 1px solid ${rule}; cursor: pointer; outline: none; transition: border-color 140ms cubic-bezier(0.4,0,0.2,1);`;\n      out.nValueStyle = has\n        ? \"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 500; color: #E8AF38;\"\n        : `font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 16px; font-weight: 500; color: rgba(232,225,201,${ghostAlpha});`;\n      out.nChevronStyle = `display: inline-block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; line-height: 1; color: ${st.open ? \"rgba(232,175,56,0.8)\" : \"rgba(232,225,201,0.42)\"}; transform: rotate(${st.open ? 180 : 0}deg); transition: transform 180ms cubic-bezier(0.2,0,0,1), color 140ms linear;`;\n      out.nCaptionStyle = `margin-top: 9px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(232,225,201,${st.open ? 0.4 : (has ? 0.35 : 0.62)}); transition: color 140ms linear;`;\n      out.nBufferStyle = \"display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px 8px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(232,225,201,0.4);\";\n      out.nThumbStyle = `position: absolute; left: 0; right: 0; top: ${st.thumbTop}px; height: ${st.thumbH}px; background: rgba(232,225,201,0.42); border-radius: 1px;`;\n    } else {\n      const fill = st.open ? 0.5 : 0.62;\n      out.cSeatStyle = `display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-radius: 8px; background: rgba(255,255,255,${fill}); box-shadow: inset 0 1px 2px 0 rgba(12,16,32,0.06), inset 0 0 0 1px rgba(12,16,32,0.07); cursor: pointer; outline: none; transition: background 140ms cubic-bezier(0.4,0,0.2,1), box-shadow 140ms cubic-bezier(0.4,0,0.2,1);`;\n      out.cValueStyle = has\n        ? \"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 600; color: #0C1020;\"\n        : `font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 15px; font-weight: 500; color: rgba(12,16,32,${ghostAlpha});`;\n      out.cChevronStyle = `display: inline-block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; line-height: 1; color: rgba(12,16,32,${st.open ? 0.5 : 0.42}); transform: rotate(${st.open ? 180 : 0}deg); transition: transform 180ms cubic-bezier(0.2,0,0,1);`;\n      out.cCaptionStyle = `margin-top: 7px; padding-left: 2px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(12,16,32,${st.open ? 0.38 : (has ? 0.35 : 0.5)}); transition: color 140ms linear;`;\n      out.cBufferStyle = \"display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px 8px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(12,16,32,0.42);\";\n      out.cThumbStyle = `position: absolute; left: 0; right: 0; top: ${st.thumbTop}px; height: ${st.thumbH}px; background: rgba(12,16,32,0.26); border-radius: 1px;`;\n    }\n\n    out[P + \"Open\"] = st.open;\n    out[P + \"Expanded\"] = st.open ? \"true\" : \"false\";\n    out[P + \"ValueText\"] = st.value || (night ? \"your state\" : \"your state\");\n    out[P + \"BufferText\"] = st.buffer ? st.buffer.toUpperCase() : \"\";\n    out[P + \"Options\"] = st.open ? this.options(key) : [];\n    out[P + \"Toggle\"] = () => (st.open ? this.close(key) : this.open(key));\n    out[P + \"Key\"] = this.keyHandler(key);\n    out[P + \"Scroll\"] = () => this.measure(key);\n    out[P + \"ListRef\"] = el => { this.refs[key] = el; };\n    return out;\n  }\n\n  renderVals() {\n    const n = this.pack(\"night\"), c = this.pack(\"cream\");\n    // buffer chip lives at the right of the count line\n    n.nBufferText = this.state.night.buffer ? this.state.night.buffer.toUpperCase() : \"50 states\";\n    c.cBufferText = this.state.cream.buffer ? this.state.cream.buffer.toUpperCase() : \"50 states\";\n    if (this.state.night.buffer) n.nBufferStyle = n.nBufferStyle.replace(\"rgba(232,225,201,0.4)\", \"#E8AF38\").replace(\"font-weight: 500\", \"font-weight: 700\").replace(\"0.18em\", \"0.24em\");\n    if (this.state.cream.buffer) c.cBufferStyle = c.cBufferStyle.replace(\"rgba(12,16,32,0.42)\", \"#A8761F\").replace(\"font-weight: 500\", \"font-weight: 700\").replace(\"0.18em\", \"0.24em\");\n    return Object.assign({}, n, c);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
