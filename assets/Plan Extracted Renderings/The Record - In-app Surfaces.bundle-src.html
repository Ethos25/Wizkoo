<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Record — In-app Surfaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #2a2926; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  .stage { display: flex; gap: 56px; align-items: flex-start; justify-content: center; padding: 64px 32px 120px; flex-wrap: wrap; }
  .phone { width: 390px; background: #F8F4E9; box-shadow: 0 24px 60px -20px rgba(12,16,32,0.32); }
  .phone-label { font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 14px; }
  .col { display: flex; flex-direction: column; align-items: flex-start; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#2a2926">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <!-- Two phone silhouettes on the dark stage, with a Fraunces-italic R glyph centered above -->
    <rect x="0" y="0" width="1200" height="800" fill="#2a2926"/>
    <!-- left phone -->
    <rect x="280" y="200" width="220" height="440" rx="6" fill="#F8F4E9"/>
    <!-- saffron tab marker -->
    <rect x="380" y="240" width="40" height="2" fill="#E8AF38"/>
    <!-- big number row -->
    <rect x="300" y="320" width="60" height="22" fill="#0C1020"/>
    <rect x="380" y="320" width="40" height="22" fill="#0C1020"/>
    <rect x="440" y="320" width="40" height="22" fill="#0C1020"/>
    <!-- diagnostic line -->
    <rect x="300" y="380" width="180" height="6" fill="#0C1020" opacity="0.55"/>
    <rect x="300" y="394" width="120" height="6" fill="#0C1020" opacity="0.55"/>
    <!-- table rows -->
    <g opacity="0.65">
      <rect x="300" y="450" width="180" height="2" fill="#0C1020"/>
      <rect x="300" y="475" width="120" height="3" fill="#3848D0"/>
      <rect x="300" y="500" width="120" height="3" fill="#18A0B8"/>
      <rect x="300" y="525" width="120" height="3" fill="#38B060"/>
      <rect x="300" y="550" width="120" height="3" fill="#C83030"/>
      <rect x="300" y="575" width="120" height="3" fill="#8848E0"/>
    </g>
    <!-- right phone -->
    <rect x="700" y="200" width="220" height="440" rx="6" fill="#F8F4E9"/>
    <!-- card 1 ledger bars -->
    <g>
      <rect x="720" y="260" width="180" height="2" fill="#0C1020" opacity="0.18"/>
      <rect x="720" y="262" width="140" height="2" fill="#0C1020"/>
      <rect x="720" y="280" width="180" height="2" fill="#0C1020" opacity="0.18"/>
      <rect x="720" y="282" width="100" height="2" fill="#0C1020"/>
      <rect x="720" y="300" width="180" height="2" fill="#0C1020" opacity="0.18"/>
      <rect x="720" y="302" width="120" height="2" fill="#0C1020"/>
    </g>
    <!-- card 3 quiet grid -->
    <g>
      <rect x="720" y="380" width="180" height="60" fill="#F2EBDA"/>
      <g fill="#0C1020">
        <rect x="730" y="390" width="14" height="14" opacity="0.62"/>
        <rect x="748" y="390" width="14" height="14" opacity="0.34"/>
        <rect x="766" y="390" width="14" height="14" opacity="0.62"/>
        <rect x="784" y="390" width="14" height="14" opacity="0.62"/>
        <rect x="802" y="390" width="14" height="14" opacity="0.16"/>
        <rect x="820" y="390" width="14" height="14" opacity="0.62"/>
        <rect x="838" y="390" width="14" height="14" opacity="0.34"/>
        <rect x="856" y="390" width="14" height="14" opacity="0.62"/>
        <rect x="874" y="390" width="14" height="14" opacity="0.62"/>
        <rect x="730" y="408" width="14" height="14" opacity="0.62"/>
        <rect x="748" y="408" width="14" height="14" opacity="0.62"/>
        <rect x="766" y="408" width="14" height="14" opacity="0.34"/>
        <rect x="784" y="408" width="14" height="14" opacity="0.62"/>
        <rect x="802" y="408" width="14" height="14" opacity="0.62"/>
        <rect x="820" y="408" width="14" height="14" opacity="0.16"/>
        <rect x="838" y="408" width="14" height="14" opacity="0.62"/>
        <rect x="856" y="408" width="14" height="14" opacity="0.62"/>
        <rect x="874" y="408" width="14" height="14" opacity="0.62"/>
      </g>
    </g>
    <!-- assessment percentile mark -->
    <text x="720" y="510" font-family="Fraunces, serif" font-style="italic" font-weight="600" font-size="40" fill="#0C1020">84</text>
    <rect x="720" y="525" width="100" height="3" fill="#E8AF38"/>
    <!-- Wordmark "The Record" centered top -->
    <text x="600" y="130" font-family="Fraunces, serif" font-weight="600" font-size="48" fill="#F8F4E9" text-anchor="middle" letter-spacing="-1">The Record</text>
    <circle cx="730" cy="118" r="5" fill="#E8AF38"/>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel" src="record-summary.jsx"></script>
<script type="text/babel" src="record-deeper.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <div className="stage">
        <div className="col">
          <div className="phone-label">Annual Compliance Summary · everyday-check</div>
          <div className="phone"><ComplianceSummary/></div>
        </div>
        <div className="col">
          <div className="phone-label">Deeper Progress · four cards expanded</div>
          <div className="phone"><DeeperProgress/></div>
        </div>
      </div>
    );
  }
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
</script>
</body>
</html>
