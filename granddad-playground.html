<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granddad Physics | Elite Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #080c1a; /* Deeper cinematic dark */
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #F0F2F8;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .labels-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        .dom-label {
            position: absolute;
            text-align: center;
            transition: opacity 0.4s ease;
            width: max-content;
            /* Seoul Glassmorphism */
            background: rgba(10, 17, 34, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .dom-label::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 30px;
            /* Fading vector gradient instead of dashed line */
            background: linear-gradient(to bottom, rgba(220, 166, 54, 0), rgba(220, 166, 54, 0.6));
            border: none;
        }
        .dom-label .name {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: #dca636;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .dom-label .desc {
            font-size: 12px;
            color: rgba(255,255,255,0.55);
            line-height: 1.4;
            text-wrap: balance;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>
    <div class="labels-container" id="labels"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const subjectsData = [
            // All subjects have identical orbitRadius (44) so they are perfectly equidistant from the nucleus.
            // Angles are staggered mathematically so they are equidistant from each other.
            
            // Ring 0 (3 subjects, 120 degrees apart)
            { id: 'math', name: 'MATH', desc: 'Measuring bone lengths.<br>Which is longest?', ringIndex: 0, orbitRadius: 44, speed: 0.00005, angle: 0.0 }, 
            { id: 'art', name: 'ART', desc: 'Sketch the human skeleton.<br>Label every bone you can name.', ringIndex: 0, orbitRadius: 44, speed: 0.00005, angle: 2.094 }, 
            { id: 'geography', name: 'GEOGRAPHY', desc: 'Visit Würzburg, Germany.<br>Where X-rays were born.', ringIndex: 0, orbitRadius: 44, speed: 0.00005, angle: 4.188 }, 

            // Ring 1 (2 subjects, 180 degrees apart, offset to fill gaps)
            { id: 'science', name: 'SCIENCE', desc: 'How fractures heal.<br>Why does a cast work?', ringIndex: 1, orbitRadius: 44, speed: 0.00004, angle: 1.047 }, 
            { id: 'reading', name: 'READING', desc: 'The man who accidentally<br>saw through his wife\'s hand.', ringIndex: 1, orbitRadius: 44, speed: 0.00004, angle: 4.188 }, 
            
            // Ring 2 (2 subjects, 180 degrees apart, offset to fill remaining gaps)
            { id: 'history', name: 'HISTORY', desc: '1895. One accident changed<br>medicine forever.', ringIndex: 2, orbitRadius: 44, speed: 0.00003, angle: 2.617 }, 
            { id: 'writing', name: 'WRITING', desc: 'A get-well letter to Granddad.<br>What would you say?', ringIndex: 2, orbitRadius: 44, speed: 0.00003, angle: 5.759 } 
        ];

        // 1. Setup Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060913); // Even deeper cinematic dark
        
        // VOLUMETRIC FOG (Pixar depth)
        scene.fog = new THREE.FogExp2(0x060913, 0.008); 

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 150); // Pulled back for perfect wide layout

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Exact Lighting to match reference (Top-left sun, soft bottom-right shadow)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Warm fill
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.0); // Bright top-left light
        sunLight.position.set(-30, 40, 50);
        scene.add(sunLight);
        
        const rimLight = new THREE.DirectionalLight(0x4a6bb8, 0.8); // Soft blue rim from bottom right
        rimLight.position.set(30, -30, -20);
        scene.add(rimLight);

        const systemGroup = new THREE.Group();
        scene.add(systemGroup);

        // 3. Nucleus (Granddad) - FROSTED AMBER GLASS (Pixar x Seoul)
        const nucleusGeo = new THREE.SphereGeometry(10, 64, 64);
        
        // The Frosted Outer Shell
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xdca636,
            emissive: 0x3a2000,
            roughness: 0.25,        // Frosted but smooth
            metalness: 0.1,
            transmission: 0.8,      // Glass-like
            thickness: 2.0,         // Refraction thickness
            clearcoat: 1.0,         // Seoul polished sheen
            clearcoatRoughness: 0.1,
            ior: 1.5                // Index of refraction
        });
        const nucleus = new THREE.Mesh(nucleusGeo, glassMat);
        systemGroup.add(nucleus);
        
        // The Inner Glowing Core
        const coreGeo = new THREE.SphereGeometry(7, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffeebb });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        nucleus.add(coreMesh); // Nest inside the nucleus

        // 4. Orbital Rings (Exactly 3 rings like an atom, all perfectly identical radius)
        const ringsData = [
            { radius: 44, tiltX: 0.4, tiltZ: 0.3 },
            { radius: 44, tiltX: -0.3, tiltZ: 0.5 },
            { radius: 44, tiltX: 0.5, tiltZ: -0.4 }
        ];
        
        const ringGroups = [];
        ringsData.forEach(r => {
            const curve = new THREE.EllipseCurve(0, 0, r.radius, r.radius, 0, 2 * Math.PI, false, 0);
            const points = curve.getPoints(120);
            const ringGeo = new THREE.BufferGeometry().setFromPoints(points);
            // Extremely faint atmospheric threads (opacity 0.03)
            const ringMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.03, linewidth: 1 });
            const ring = new THREE.Line(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            
            const orbitGroup = new THREE.Group();
            orbitGroup.rotation.x = r.tiltX;
            orbitGroup.rotation.z = r.tiltZ;
            orbitGroup.add(ring);
            systemGroup.add(orbitGroup);
            ringGroups.push(orbitGroup);
        });

        // 5. Planets & Labels
        const planetGeo = new THREE.SphereGeometry(1.4, 32, 32);
        const planets = [];
        const labelsContainer = document.getElementById('labels');

        subjectsData.forEach(data => {
            const orbitGroup = ringGroups[data.ringIndex];
            
            // Ceramic Material (Seoul)
            const planetMat = new THREE.MeshPhysicalMaterial({ 
                color: 0x1a1a1a,        // Dark base
                emissive: 0x2a2010,     // Slight warm glow
                roughness: 0.1,         // Very polished
                metalness: 0.8,         // Highly reflective
                clearcoat: 1.0          // Glassy shell
            });
            const planetMesh = new THREE.Mesh(planetGeo, planetMat);
            orbitGroup.add(planetMesh);

            const labelEl = document.createElement('div');
            labelEl.className = 'dom-label';
            labelEl.innerHTML = `<div class="name">${data.name}</div><div class="desc">${data.desc}</div>`;
            labelsContainer.appendChild(labelEl);

            planets.push({ mesh: planetMesh, orbitGroup: orbitGroup, element: labelEl, data: data });
        });

        // 6. Cinematic Dust Motes (Pixar)
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1500;
        const posArray = new Float32Array(starsCount * 3);
        const velocityArray = new Float32Array(starsCount * 3);
        
        for(let i=0; i<starsCount*3; i+=3) {
            posArray[i]   = (Math.random() - 0.5) * 300;
            posArray[i+1] = (Math.random() - 0.5) * 300;
            posArray[i+2] = (Math.random() - 0.5) * 300;
            
            // Random slow drift velocities
            velocityArray[i]   = (Math.random() - 0.5) * 0.05;
            velocityArray[i+1] = (Math.random() - 0.5) * 0.05;
            velocityArray[i+2] = (Math.random() - 0.5) * 0.05;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        starsGeo.setAttribute('velocity', new THREE.BufferAttribute(velocityArray, 3));
        
        const starsMat = new THREE.PointsMaterial({
            size: 0.8,
            color: 0xffebc2, // Warm stardust
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending // Glow effect
        });
        const starMesh = new THREE.Points(starsGeo, starsMat);
        scene.add(starMesh);

        // 6. Animation Loop
        let mouseX = 0;
        let mouseY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;
        
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.0005;
            mouseY = (event.clientY - windowHalfY) * 0.0005;
        });

        const clock = new THREE.Clock();
        // Tilt the entire solar system dramatically forward to match reference image
        const baseSystemRotation = new THREE.Euler(0.7, -0.1, 0);
        systemGroup.rotation.copy(baseSystemRotation);

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Parallax camera
            camera.position.x += (mouseX * 10 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 10 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            // Very subtle system breathing
            systemGroup.rotation.x = baseSystemRotation.x + Math.sin(time * 0.2) * 0.03 + (mouseY * 0.1);
            systemGroup.rotation.y = baseSystemRotation.y + Math.cos(time * 0.15) * 0.03 + (mouseX * 0.1);
            
            // Rotate nucleus slowly
            nucleus.rotation.y += 0.001;
            
            // Animate dust motes (Pixar)
            const positions = starMesh.geometry.attributes.position.array;
            const velocities = starMesh.geometry.attributes.velocity.array;
            for(let i=0; i<starsCount*3; i+=3) {
                positions[i] += velocities[i];
                positions[i+1] += velocities[i+1];
                positions[i+2] += velocities[i+2];
                
                // Wrap around logic
                if (positions[i] > 150) positions[i] = -150;
                if (positions[i] < -150) positions[i] = 150;
                if (positions[i+1] > 150) positions[i+1] = -150;
                if (positions[i+1] < -150) positions[i+1] = 150;
                if (positions[i+2] > 150) positions[i+2] = -150;
                if (positions[i+2] < -150) positions[i+2] = 150;
            }
            starMesh.geometry.attributes.position.needsUpdate = true;
            starMesh.rotation.y = time * 0.003;

            // Update planet positions and sync DOM labels
            planets.forEach(p => {
                p.data.angle += p.data.speed;
                p.mesh.position.x = Math.cos(p.data.angle) * p.data.orbitRadius;
                p.mesh.position.z = Math.sin(p.data.angle) * p.data.orbitRadius;

                // Sync DOM Label
                const tempV = new THREE.Vector3();
                p.mesh.getWorldPosition(tempV);
                tempV.project(camera);

                const x = (tempV.x *  .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                p.element.style.left = `${x}px`;
                p.element.style.top = `${y}px`;
                p.element.style.transform = `translate(-50%, 25px)`; // Push down 25px, aligning the dashed line to the planet
                
                // Opacity based on depth
                const depth = tempV.z;
                let opacity = 1.0;
                if (depth > 0.95) opacity = 0.4;
                else if (depth > 0.9) opacity = 0.7;
                p.element.style.opacity = opacity;
                p.element.style.zIndex = depth > 0.95 ? 1 : 10;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
