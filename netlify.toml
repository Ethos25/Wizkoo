# ── What this site publishes ────────────────────────────────────────────────
# publish was "." until Aug 4, 2026, which made the repository and the website
# the same set of files: runbooks, audit reports, migration scripts and 68
# internal design comps under assets/ were all fetchable on www.wizkoo.com.
#
# The command below assembles _site/ from the paths named in
# publish-allowlist.txt, and Netlify serves _site/. Nothing reaches the website
# except by being named in that file. To ship a new page, add one line to it.
#
# The build FAILS, and Netlify deploys nothing, if a root-level .html file in
# the repo appears in neither section of publish-allowlist.txt. The failure
# message names the file and the one-line edit that clears it.
[build]
  publish = "_site"
  command = "node scripts/build-site.js"

# moderation-digest retired 2026-07-31 (Excellence Round 1 addendum, ruling 3).
# It read what validate-theme wrote; validate-theme died with the intake form,
# so the digest would have emailed an empty report every Sunday forever.
# Function file and its schedule both removed. Git history preserves both.

# ── /morgue/ — REMOVED FROM THE PUBLISHED OUTPUT (Aug 4, 2026) ──────────────
# The morgue archives certified surfaces after they are retired: screenshots
# of the surface as deployed plus its frozen markup and styles. It is an
# internal working record of KILLED work, not a public page.
#
# WHAT WAS HERE, AND WHY IT DID NOT WORK. Two [[context.production.redirects]]
# blocks stood here, forcing /morgue and /morgue/* to a 404 in production only,
# so that previews kept serving it. They never fired. On Aug 4 the morgue was
# fetchable on www.wizkoo.com: /morgue/ and /morgue/index.html both returned
# 200 and served the real archive.
#
# CAUSE: deploy-context scoping is NOT SUPPORTED for redirects. Netlify's
# file-based-configuration docs: "Certain keys, such as [build] and [[plugins]]
# but not [[redirects]] or [[headers]], allow you to set [context] properties",
# and "Redirects and headers are GLOBAL for all builds - they do not get scoped
# to contexts no matter where you define them in the file. For context-specific
# rules, use _headers or _redirects files, which are PER-DEPLOY."
# A [[context.production.redirects]] block is accepted silently and ignored, so
# the rules protected NOTHING in ANY context. The [[headers]] block below is a
# plain top-level key, which is why IT fired (X-Robots-Tag was served) while the
# redirects did not — the split that localised the fault.
#
# The old note here also warned against duplicating these into _redirects "for
# context support". That was backwards: _redirects is the per-deploy file and is
# exactly where a context-specific rule belongs. Do not act on that old advice.
#
# THE FIX IS CATEGORICAL, NOT ROUTED. The morgue was taken out of the tracked
# tree and .gitignored rather than routed around, because at the time publish
# was "." and tracked meant published. A file that is not there cannot be
# served by a rule that fails to fire. That still holds, and the allowlist now
# holds it a second way: morgue/ is not named in publish-allowlist.txt, so it
# would not be published even if it returned to the tree. NOTHING IS LOST: the
# morgue is intact in git history and recoverable —
#   git show 47cedd3:morgue/index.html
#   git show 47cedd3:morgue/2026-08-02-son-space-panel.html
# TRADE, STATED: this also removes the morgue from branch previews, which the
# broken rules were meant to preserve. Restoring preview-only access needs the
# documented per-deploy mechanism (a _redirects entry emitted by a build command
# that branches on $CONTEXT). Not built here — that is a separate ruling.

# Retained deliberately. Inert while the morgue is out of the published output,
# and defence in depth the moment anything under /morgue/ ever re-enters it.
[[headers]]
  for = "/morgue/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Marketing handoff to app.wizkoo.com ────────────────────────────────────
[[redirects]]
  from    = "/start"
  to      = "https://app.wizkoo.com/start"
  status  = 302
  force   = true

# ── /plan cutover to app.wizkoo.com (WP-6 Stage 3, July 12, 2026) ───────────
# 302 is deliberate and load-bearing: browsers cache 301s forever, which would
# kill the Stage 3 rollback (flip back to proxy). The 301 upgrade belongs to
# Stage 4 close-out ONLY. Do not "correct" it. Specific rules before the
# /plan/* catch-all. NOTE: duplicated in _redirects (that file wins); keep
# both in sync. Consolidation flagged for post-surgery.
[[redirects]]
  from    = "/plan/onboarding"
  to      = "https://app.wizkoo.com/generate"
  status  = 302
  force   = true

[[redirects]]
