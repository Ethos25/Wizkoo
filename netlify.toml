[build]
  publish = "."
  functions = "netlify/functions"

# moderation-digest retired 2026-07-31 (Excellence Round 1 addendum, ruling 3).
# It read what validate-theme wrote; validate-theme died with the intake form,
# so the digest would have emailed an empty report every Sunday forever.
# Function file and its schedule both removed. Git history preserves both.

# ── /plan cutover to app.wizkoo.com (WP-6 Stage 3, July 12, 2026) ───────────
# 302 is deliberate and load-bearing: browsers cache 301s forever, which would
# kill the Stage 3 rollback (flip back to proxy). The 301 upgrade belongs to
# Stage 4 close-out ONLY. Do not "correct" it. Specific rules before the
# /plan/* catch-all. NOTE: duplicated in _redirects (that file wins); keep
# both in sync. Consolidation flagged for post-surgery.
[[redirects]]
  from    = "/plan/onboarding"
  to      = "https://app.wizkoo.com/generate"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/generate"
  to      = "https://app.wizkoo.com/generate"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/sign-in"
  to      = "https://app.wizkoo.com/sign-in"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/sign-in/*"
  to      = "https://app.wizkoo.com/sign-in"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/sign-up"
  to      = "https://app.wizkoo.com/sign-up"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/sign-up/*"
  to      = "https://app.wizkoo.com/sign-up"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/dashboard"
  to      = "https://app.wizkoo.com/"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/plans/*"
  to      = "https://app.wizkoo.com/plan"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/today"
  to      = "https://app.wizkoo.com/plan"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/orbit-reports/*"
  to      = "https://app.wizkoo.com/recap"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/settings"
  to      = "https://app.wizkoo.com/"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/pricing"
  to      = "/pricing"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/privacy"
  to      = "/privacy"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/terms"
  to      = "/terms"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan"
  to      = "https://app.wizkoo.com/generate"
  status  = 302
  force   = true

[[redirects]]
  from    = "/plan/*"
  to      = "https://app.wizkoo.com/generate"
  status  = 302
  force   = true

# ── Legacy clean-URL redirects ───────────────────────────────────────────────
[[redirects]]
  from   = "/planner"
  to     = "/plan"
  status = 301

[[redirects]]
  from   = "/planner.html"
  to     = "/plan"
  status = 301

[[redirects]]
  from   = "/what-we-believe.html"
  to     = "/what-we-believe"
  status = 301

[[redirects]]
  from   = "/games.html"
  to     = "/games"
  status = 301

[[redirects]]
  from   = "/methodology.html"
  to     = "/methodology"
  status = 301

# ── Library book detail pages ────────────────────────────────────────────────
# Must come AFTER the /library exact-file match (library.html handles /library).
# force = true so the rewrite fires even though /library/ is also a directory.
[[redirects]]
  from   = "/library/:slug"
  to     = "/library/book.html"
  status = 200
  force  = true
